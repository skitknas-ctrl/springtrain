name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The built-in driver must be able to finish every track with the starter train
      - name: Check the tracks
        run: node tools/calibrate.js --check

      - name: Debug APK
        run: ./gradlew --no-daemon -PbuildNumber=${{ github.run_number }} assembleDebug

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk springtrain-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: springtrain-debug
          path: springtrain-debug.apk

      # Rolling test release: a new tag per build (0.1.0-test.<n>); older test releases are removed. Stable download URL:
      # https://github.com/${{ github.repository }}/releases/latest/download/springtrain-debug.apk
      - name: Publish test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.0-test.${{ github.run_number }}
        run: |
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E -- '-test\.[0-9]+$' | sort -t. -k4,4n -r | tail -n +3 || true); do
            gh release delete "$old" --cleanup-tag --yes || true
          done
          gh release create "$VERSION" springtrain-debug.apk \
            --latest \
            --title "Testbygge $VERSION" \
            --notes "Automatiskt bygge av commit ${GITHUB_SHA::7}. Signerat med test-nyckeln; kan installeras ovanpå tidigare testbyggen."

  # Google Play: signed app bundle (AAB). Run by hand (Actions > Build > Run workflow) or by a v* tag.
  # Needs the secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD (the upload key).
  play:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "The upload keystore secret is missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > release.keystore
      - name: Release bundle
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -PplayRelease -PbuildNumber=${{ github.run_number }} bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab springtrain-play-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: springtrain-play
          path: springtrain-play-*.aab
